name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: pnpm
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint:check
      - name: Build
        run: pnpm build
        env:
          # openai.ts and pinecone.ts throw at module scope when these are
          # unset, and next build imports every route module to collect page
          # data. API routes are dynamic, so nothing is called during the
          # build; these placeholders only let module evaluation finish.
          OPENAI_API_KEY: ci-build-placeholder
          PINECONE_API_KEY: ci-build-placeholder
          PINECONE_INDEX_NAME: ci-build-placeholder
